
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo mã hóa AES + RSA</title>
</head>
<body>
    <h1>DEMO MÃ HÓA AES + RSA</h1>

    <p>
        Mô phỏng bảo vệ dữ liệu giao dịch ví điện tử
        bằng mã hóa lai AES và RSA.
    </p>

    <h2>Thông tin giao dịch</h2>

    <form id="encryption-form">
        <label for="transaction_id">Mã giao dịch:</label>
        <input type="text" id="transaction_id" value="GD001" required>
        <br><br>

        <label for="sender">Người gửi:</label>
        <input type="text" id="sender" value="USER_A" required>
        <br><br>

        <label for="receiver">Người nhận:</label>
        <input type="text" id="receiver" value="USER_B" required>
        <br><br>

        <label for="amount">Số tiền (VND):</label>
        <input type="number" id="amount" value="100000" min="1" required>
        <br><br>

        <label for="content">Nội dung:</label>
        <input type="text" id="content" value="Chuyen tien" required>
        <br><br>

        <label for="timestamp">Thời gian:</label>
        <input type="datetime-local" id="timestamp" value="2026-10-27T19:00" required>
        <br><br>

        <button type="submit">Mã hóa và giải mã</button>
    </form>

    <h2>Kết quả</h2>
    <pre id="result">Kết quả sẽ hiển thị tại đây.</pre>

    <script src="{{ url_for('static', filename='js/encryption.js') }}"></script>
</body>
</html>
