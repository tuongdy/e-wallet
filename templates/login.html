
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | TrueWallet</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at top left, #8b5cf625, transparent 45%),
                #121218;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            background: #1e1e29;
            border: 1px solid #393347;
            border-radius: 22px;
            box-shadow: 0 20px 70px #0005;
        }

        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            font-size: 25px;
            font-weight: 800;
        }

        .login-card h1 {
            text-align: center;
            font-size: 26px;
        }

        .login-subtitle {
            margin: 8px 0 25px;
            color: #9696aa;
            text-align: center;
            font-size: 13px;
        }

        .login-card label {
            display: block;
            margin: 16px 0 7px;
            color: #dedeea;
            font-size: 13px;
        }

        .login-card input {
            width: 100%;
            padding: 13px;
            color: #fff;
            background: #121218;
            border: 1px solid #393947;
            border-radius: 10px;
            outline: none;
        }

        .login-card input:focus {
            border-color: #a78bfa;
        }

        .login-button {
            width: 100%;
            margin-top: 23px;
            padding: 14px;
            color: #fff;
            background: linear-gradient(110deg, #8b5cf6, #6d45d9);
            border: 0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            filter: brightness(1.12);
        }

        .login-error {
            margin-top: 14px;
            padding: 10px;
            color: #fca5a5;
            background: #ef444415;
            border-radius: 8px;
            font-size: 12px;
        }

        .login-note {
            margin-top: 20px;
            color: #9696aa;
            text-align: center;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <div class="login-brand">
                <div class="brand-icon">T</div>
                <span>True<span class="brand-highlight">Wallet</span></span>
            </div>

            <h1>Chào mừng trở lại</h1>
            <p class="login-subtitle">
                Đăng nhập để trải nghiệm ví điện tử demo
            </p>

            <form action="{{ url_for('login') }}" method="POST">
                <label for="username">Tên đăng nhập</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Nhập tên đăng nhập"
                    maxlength="50"
                    required
                >

                <label for="password">Mật khẩu</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Nhập mật khẩu"
                    required
                >


{% if message %}
    <div style="margin-top:14px;color:#4ade80;font-size:13px">
        {{ message }}
    </div>
{% endif %}

{% if error %}
    <div class="login-error">
        {{ error }}
    </div>
{% endif %}

                <button type="submit" class="login-button">
                    Đăng nhập →
                </button>
                <p style="margin-top:20px;text-align:center;color:#9696aa;font-size:12px">
    Chưa có tài khoản?
    <a href="{{ url_for('register') }}" style="color:#a78bfa;font-weight:bold">
        Đăng ký ngay
    </a>
</p>
            </form>

            <p class="login-note">
                Đây là giao diện mô phỏng phục vụ học tập.
            </p>
        </section>
    </main>
</body>
</html>
